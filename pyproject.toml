[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "agentarch"
version = "0.1.0"
description = "Runtime Architectural Drift Detection and Conformance Checking for LLM Multi-Agent Systems via OpenTelemetry Traces"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Leonardo Baca Calsin", email = "lbacac@unsa.edu.pe" },
    { name = "German Arturo Chipana Jeronimo", email = "gchipanaj@unsa.edu.pe" }
]
requires-python = ">=3.10"
keywords = [
    "multi-agent systems",
    "large language models",
    "software architecture",
    "architectural drift",
    "runtime verification",
    "opentelemetry"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/leonardobaca7/agentarch"
Repository = "https://github.com/leonardobaca7/agentarch.git"
"Bug Tracker" = "https://github.com/leonardobaca7/agentarch/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
